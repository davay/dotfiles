---
- name: Mac setup
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: "Homebrew: Add taps"
      # [C] Homebrew 6.0.0 requires non-official taps/formulae/casks to be trusted before
      # loading. This is automated via ~/.homebrew/trust.json, tracked in yadm and checked
      # out before this playbook runs, so no manual `brew trust` is needed.
      community.general.homebrew_tap:
        name:
          - felixkratz/formulae
          - hashicorp/tap
          - eigenwallet/eigenwallet
          - nikitabobko/tap
          - oven-sh/bun
          - charmbracelet/tap
          - mutagen-io/mutagen
          - xo/xo
          - LucasPickering/tap # slumber API client

    - name: "Homebrew: Update"
      # [C] Run brew update once here so the per-package loop below doesn't re-run it every item
      community.general.homebrew:
        update_homebrew: yes

    - name: "Homebrew: Install packages"
      community.general.homebrew:
        name: "{{ item }}"
        state: latest
      register: pkg_result
      until: pkg_result is succeeded
      retries: 3
      delay: 15
      loop:
        ### Shell ###
        - zsh
        - fish
        - powerlevel10k
        - zsh-vi-mode # oh-my-zsh
        - zsh-autosuggestions # oh-my-zsh
        - zsh-syntax-highlighting # oh-my-zsh
        - zsh-autocomplete # oh-my-zsh

        ### Languages & Runtimes ###
        - python
        - node
        - bun
        - lua
        - luarocks
        - rust
        - go
        - mise # manages python system-wide
        - uv # manages python packages in a repo

        ### Editor & Terminal ###
        - nvim
        - ghostty
        - abduco

        ### Dev Tools ###
        - gh
        - lazygit
        - gitui
        - docker-compose
        - mutagen
        - devutils
        - webpack
        - terraform
        - slumber

        ### Swift / Xcode ###
        - xcode-build-server # these 4 for nvim xcode
        - swiftformat
        - swiftlint
        - xcbeautify

        ### CLI Utilities ###
        - mas
        - tree
        - htop
        - fzf
        - coreutils
        - jq
        - moreutils
        - gnu-sed
        - ripgrep
        - fd
        - lsd
        - bat
        - bat-extras
        - mdcat # markdown cat
        - yazi
        - visidata
        - stats
        - code-minimap

        ### Media & Documents ###
        - imagemagick
        - pandoc
        - ffmpeg
        - skim # pdf viewer for latex in nvim

        ### Networking & Databases ###
        - mosh
        - xh # "is a friendly and fast tool for sending HTTP requests"
        - usql # "Universal command-line interface for SQL databases"

        ### Embedded & Hardware ###
        - arduino-cli
        - platformio

        ### AI ###
        - ollama

        ### Ricing ###
        - sketchybar
        - borders
        - pastel
        - cava # this is tied to background-music for visualizer

        ### Misc & Fun ###
        - sl
        - pipes-sh
        - thefuck
        - fastfetch # replaces deprecated neofetch
        - eigenwallet

    - name: "Add Fish shell to /etc/shells"
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /opt/homebrew/bin/fish
        state: present
      become: yes

    - name: "Change default shell to Fish"
      ansible.builtin.user:
        name: "{{ lookup('env', 'USER') }}" # [C] env lookup, not ansible_user_id fact (gather_facts is off)
        shell: /opt/homebrew/bin/fish
      become: yes

    - name: "Homebrew: Install casks"
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: latest
      # [C] Cask downloads are occasionally flaky (connection reset); retry each cask a few times
      register: cask_result
      until: cask_result is succeeded
      retries: 3
      delay: 15
      loop:
        ### Browsers & Communication ###
        - arc
        - discord
        - zoom
        - signal
        - whatsapp
        - mimestream # gmail

        ### Security & Privacy ###
        - 1password
        - 1password-cli
        - gpg-suite
        - mullvadvpn
        - adguard

        ### Development ###
        - docker
        # [C] parallels installed separately below — its post-install chowns its
        # [C] own bundle to root:wheel, which needs the terminal's "App Management"
        # [C] (or Full Disk Access) TCC permission. See the dedicated task after
        # [C] this loop so a privacy block warns instead of aborting the run.
        - tuist # Xcode
        - claude

        ### Design & Creative ###
        - figma
        - affinity-designer
        - affinity-photo
        - affinity-publisher
        - sf-symbols
        - pixelsnap2
        - blender

        ### Media ###
        - iina
        - obs
        - background-music # 2026-09-01 - AAAA I really want this to work again for visualizer on sketchybar, and I haven't used it in ages,

        ### 3D Printing, CAD & Electronics ###
        - bambu-studio
        - freecad # 3d printing -- dont forget to install addons
        - openscad@snapshot
        - kicad # pcb
        - whatcable # diagnostics on usbc ports lol

        ### Productivity & Writing ###
        - reader
        - omnifocus
        - heptabase
        - quarto # 2026-09-01 - Mostly for jupyter in nvim stuff
        - mactex
        - twine-app
        - naps2

        ### System Utilities ###
        - karabiner-elements
        - linearmouse
        - shottr
        - backblaze
        - raycast
        - google-drive
        - webcatalog # 2026-09-01 - I forgot this existed, should revisit -- can be quite useful actually
        - altserver
        - unified-remote # 2026-09-01 - This was very useful back then, should revisit
        - bettertouchtool
        - keyclu
        - lunar
        - kindavim
        - wooshy
        - balenaetcher
        - logi-options+
        - rustdesk
        - insta360-link-controller

        ### Ricing ###
        # - rectangle-pro # 2026-09-01 - Useful for stage manager, trying to make it work with aerospace
        - aerospace

        ### Games ###
        - steam

    # [C] Parallels is split out of the cask loop: its post-install runs
    # [C] inittool/pdfm-bootstrap, which chowns "/Applications/Parallels Desktop.app"
    # [C] to root:wheel. That requires the terminal running this play to hold
    # [C] "App Management" (or Full Disk Access) under System Settings ->
    # [C] Privacy & Security. Without it every chown returns "Operation not
    # [C] permitted", the cask errors, and (in the loop) it would spray retries
    # [C] and abort. macOS cannot be granted this permission from a script (that
    # [C] is the whole point of TCC), so we install it in a block/rescue: on a
    # [C] privacy block we pause with instructions instead of failing the run.
    # [C] The .app itself is already usable and re-initializes (with an admin
    # [C] prompt) on first launch, so continuing is safe.
    - name: "Homebrew: Install Parallels (needs App Management TCC permission)"
      block:
        - name: "Homebrew: Install Parallels cask"
          community.general.homebrew_cask:
            name: parallels
            state: latest
          register: parallels_result
          until: parallels_result is succeeded
          retries: 3
          delay: 15
      rescue:
        # [C] Post-install was blocked by TCC (App Management). We can't grant
        # [C] the permission from a script, but we can open the exact pane, let
        # [C] the user toggle it live, then retry the install in the same run.
        - name: "Open the App Management privacy pane"
          ansible.builtin.command:
            cmd: open "x-apple.systempreferences:com.apple.preference.security?Privacy_AppBundles"
          changed_when: false
          failed_when: false # [C] non-fatal: pause below still explains what to do

        - name: "Pause: grant terminal App Management, then retry"
          ansible.builtin.pause:
            prompt: |
              Parallels' post-install was blocked by macOS (App Management).
              I just opened System Settings -> Privacy & Security -> App Management.

                1. Toggle ON your terminal app in that list (it's already listed
                   since the block just happened).
                2. If macOS offers "Quit & Reopen", DON'T — that kills this run.
                   Just leave the terminal open.

              Then press ENTER and I'll retry the Parallels install.

        # [C] Retry in a nested block/rescue: if it still fails, App Management
        # [C] likely needs the terminal relaunched, so we tell the user to
        # [C] relaunch + re-run rather than aborting the whole play.
        - name: "Retry Parallels after granting permission"
          block:
            - name: "Homebrew: Retry Parallels cask"
              community.general.homebrew_cask:
                name: parallels
                state: latest
              register: parallels_retry
              until: parallels_retry is succeeded
              retries: 2
              delay: 10
          rescue:
            - name: "Parallels still blocked — relaunch terminal and re-run"
              ansible.builtin.debug:
                msg: >-
                  Parallels post-install still failed. macOS may require your
                  terminal to be quit & reopened for the new App Management
                  permission to take effect. Relaunch the terminal, then re-run
                  this playbook. (Parallels also finishes initializing, with an
                  admin prompt, the first time you launch it — so this is safe
                  to skip.)

    # This is unused now but leaving it here anyway
    # - name: "Homebrew: Start Services"
    #   community.general.homebrew_services:
    #     name:
    #     state: present

    - name: "Cargo: Install Rust Packages"
      community.general.cargo:
        name:
          - wallust # might be unused now
          - tree-sitter-cli # To auto install TS parsers

    - name: "Mac App Store: Install apps"
      community.general.mas:
        id:
          - 1440147259 # [Safari] Adguard
          - 1601151613 # [Safari] Baking Soda
          - 1592917505 # [Safari] Noir
          - 1480933944 # [Safari] Vimari
          - 6471380298 # [Safari] StopTheMadness
          - 1622835804 # [Safari] Kagi
          - 1519867270 # [Safari] RefinedGithub
          - 1552641506 # [Safari] GhostText
          - 1520333300 # [Safari] Wappalyzer
          - 6738274497 # [Safari] Raycast Companion
          - 1541862561 # [Safari] FireShot
          - 937984704 # Amphetamine
          - 409183694 # Keynote
          - 409203825 # Numbers
          - 409201541 # Pages
          - 1448648921 # Seashore
          - 1276493162 # reMarkable
          - 1351639930 # Gifski
          - 1487937127 # Craft
          - 775737590 # iA Writer
          - 6636493997 # ExcalidrawZ
          - 6746414429 # iA Presenter
          - 640199958 # Apple Developer
        state: latest

    - name: "Disable startup sound"
      ansible.builtin.command: nvram StartupMute=%01
      become: yes
      changed_when: false

    - name: "Allow apps from anywhere (Gatekeeper)"
      ansible.builtin.command: spctl --global-disable
      become: yes
      changed_when: false
      failed_when: false

    - name: "Load locate database daemon"
      ansible.builtin.command: launchctl load -w /System/Library/LaunchDaemons/com.apple.locate.plist
      become: yes
      changed_when: false
      failed_when: false # [C] already-loaded on re-run is fine

    - name: "Set hostnames to da-mac"
      ansible.builtin.command: "scutil --set {{ item }} da-mac"
      become: yes
      changed_when: false
      loop:
        - HostName
        - LocalHostName
        - ComputerName

    - name: "Flush DNS cache"
      ansible.builtin.command: dscacheutil -flushcache
      changed_when: false

    - name: "Install all Nerd Fonts"
      ansible.builtin.shell: >
        brew search '/font-.*-nerd-font/' | awk '{ print $1 }'
        | xargs -I{} brew install --cask {}
      changed_when: false
      failed_when: false

    - name: "Copy custom fonts to /Library/Fonts"
      ansible.builtin.copy:
        src: fonts/ # [C] relative to this playbook's dir (~/.config/yadm/fonts/)
        dest: /Library/Fonts/
      become: yes

    # Mac Defaults

    - name: "Reload cfprefsd before writing defaults"
      # [C] Kill cfprefsd BEFORE the osx_defaults writes so it reloads the yadm-tracked
      # plists fresh and the writes below land on top (win) instead of being clobbered
      # by a later reload. failed_when:false — killall exits non-zero if none running.
      ansible.builtin.command: killall cfprefsd
      changed_when: false
      failed_when: false

    - name: "osx_defaults: Disable system Tink sound"
      community.general.osx_defaults:
        domain: com.apple.systemsound
        key: com.apple.sound.uiaudio.enabled
        type: int
        value: 0
        state: present

    - name: "osx_defaults: Enable Key Repeat"
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: ApplePressAndHoldEnabled
        type: bool
        value: false
        state: present

    - name: "osx_defaults: Decrease key repeat initial delay"
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: InitialKeyRepeat
        type: int
        value: 10
        state: present

    - name: "osx_defaults: Decrease delay between key repeats"
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: KeyRepeat
        type: int
        value: 2
        state: present

    - name: "osx_defaults: Reduce alert sound volume"
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.sound.beep.volume
        type: float

        # Alert volume conversion:
        # 75%: 0.7788008
        # 50%: 0.6065307
        # 25%: 0.4723665
        value: 0.6065307

    - name: "osx_defaults: Autohide menu bar"
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: _HIHideMenuBar
        type: int
        value: 1
        state: present

    - name: "osx_defaults: Disable spaces autoreordering" # initially this was required for yabai, but, I like it better this way anyway?
      community.general.osx_defaults:
        domain: com.apple.dock
        key: mru-spaces
        type: bool
        value: false
        state: present

    - name: "osx_defaults: Disable mouse acceleration"
      community.general.osx_defaults:
        domain: .GlobalPreferences
        key: com.apple.mouse.scaling
        # to verify type: defaults read-type <domain> <key*>
        type: float
        value: -1.0
        state: present

    ### https://apple.stackexchange.com/questions/59556/is-there-a-way-to-completely-disable-dock

    - name: "osx_defaults: Autohide dock"
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: true
        state: present

    - name: "osx_defaults: Remove autohide-delay"
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide-delay
        type: float
        # A high value (e.g. 1000) will effectively prevent dock from showing automatically
        value: 0
        state: present

    - name: "osx_defaults: Faster dock show animation"
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide-time-modifier
        type: float
        value: 0.20
        state: present

    - name: "osx_defaults: Disable bounce animation for icons with notification in dock"
      community.general.osx_defaults:
        domain: com.apple.dock
        key: no-bouncing
        type: bool
        value: true
        state: present

    # conflicts with Xcode swiftui inspector cmd+ctrl+click
    # - name: "osx_defaults: Enable dragging any part of window with ctrl + cmd"
    #   community.general.osx_defaults:
    #     domain: NSGlobalDomain
    #     key: NSWindowShouldDragOnGesture
    #     type: bool
    #     value: true
    #     state: present

    - name: "osx_defaults: Enable 'Group windows by application', for AeroSpace"
      community.general.osx_defaults:
        domain: com.apple.dock
        key: expose-group-apps
        type: bool
        value: true
        state: present

    - name: "osx_defaults: Disable 'Displays have separate Spaces', for Aerospace"
      community.general.osx_defaults:
        domain: com.apple.spaces
        key: spans-displays
        type: bool
        value: true # yes true disables it
        state: present
